<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LockIn Missing Media Candidate Review</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;background:#f4f6fa;color:#172033}header,main,footer{max-width:1100px;margin:auto;padding:20px}
    header{position:sticky;top:0;background:#f4f6faf2;border-bottom:1px solid #d9deea;z-index:2}h1{margin:0 0 6px}.counts{display:flex;gap:10px;flex-wrap:wrap}.counts span{background:white;border:1px solid #d9deea;padding:7px 10px;border-radius:8px}
    button{padding:9px 12px;border:0;border-radius:8px;background:#2457d6;color:white;font-weight:700;cursor:pointer}.card{background:white;border:1px solid #d9deea;border-radius:12px;padding:16px;margin:16px 0}.preview{min-height:220px;background:#eef2f7;border-radius:9px;display:grid;place-items:center;overflow:hidden}.preview img,.preview video{width:100%;max-height:480px;object-fit:contain}.external{padding:25px;text-align:center}.warning{background:#fff2d1;border-left:5px solid #e2a000;padding:9px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:15px}.decision{display:flex;gap:20px;border-top:1px solid #ddd;padding-top:12px;margin-top:12px}a{color:#2457d6}footer{text-align:center;color:#596274}@media(max-width:700px){.meta{grid-template-columns:1fr}header{position:static}}
  </style>
</head>
<body>
  <header><h1>LockIn missing-media candidates</h1><p>Local files are review-only previews and are not integrated. Nothing is approved by default.</p><div class="counts"><span>Approved: <b id="a">0</b></span><span>Rejected: <b id="r">0</b></span><span>Unreviewed: <b id="u">10</b></span><button id="export">Export decisions</button></div></header>
  <main id="cards"></main>
  <footer>License details and all 47 research results: <a href="MISSING_MEDIA_CANDIDATES.md">MISSING_MEDIA_CANDIDATES.md</a></footer>
  <script>
  const candidates=[
    {id:7,name:"Resistance Band Row",title:"Man Doing Seated Row Exercise",creator:"Kampus Production",source:"https://www.pexels.com/video/man-doing-seated-row-exercise-6022753/",license:"Pexels License",licenseUrl:"https://www.pexels.com/legal-pages/license/",attribution:"Not required; credit appreciated",hosting:"Permitted as website/app content",warning:"Confirm the video uses LockIn's seated, legs-extended resistance-band row.",kind:"video",preview:"static/review_previews/pexels-6022753-band-row.mp4"},
    {id:12,name:"Chair Squat",title:"Exercise Chair Squat",creator:"BruceBlaus",source:"https://commons.wikimedia.org/wiki/File:Exercise_Chair_Squat.png",license:"CC BY-SA 4.0",licenseUrl:"https://creativecommons.org/licenses/by-sa/4.0/",attribution:"Required; adaptations are ShareAlike",hosting:"Permitted with creator credit and license link",warning:"Exact movement, but only a static illustration.",kind:"image",preview:"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/88/Exercise_Chair_Squat.png/500px-Exercise_Chair_Squat.png"},
    {id:52,name:"Chair Triceps Dip",title:"A Woman Doing Triceps Dip on a Chair",creator:"Michelangelo Buonarroti",source:"https://www.pexels.com/video/a-woman-doing-triceps-dip-on-a-chair-4159114/",license:"Pexels License",licenseUrl:"https://www.pexels.com/legal-pages/license/",attribution:"Not required; credit appreciated",hosting:"Permitted as website/app content",warning:"Exact movement; review chair stability and beginner suitability.",kind:"video",preview:"static/review_previews/pexels-4159114-chair-dip.mp4"},
    {id:57,name:"Forward Lunge",title:"Forward lunge training",creator:"Skhulile Mthiyane",source:"https://commons.wikimedia.org/wiki/File:Forward_lunge_training.webm",license:"CC BY-SA 4.0",licenseUrl:"https://creativecommons.org/licenses/by-sa/4.0/",attribution:"Required; adaptations are ShareAlike",hosting:"Permitted with creator credit and license link",warning:"Exact equipment-free movement; review pace and form.",kind:"video",preview:"https://upload.wikimedia.org/wikipedia/commons/0/02/Forward_lunge_training.webm"},
    {id:63,name:"Donkey Kick",title:"Black Woman Doing Donkey Kick Exercise",creator:"Klaus Nielsen",source:"https://www.pexels.com/photo/black-woman-doing-donkey-kick-exercise-6303435/",license:"Pexels License",licenseUrl:"https://www.pexels.com/legal-pages/license/",attribution:"Not required; credit appreciated",hosting:"Permitted as website/app content",warning:"Exact floor pose, but the candidate is static.",kind:"image",preview:"static/review_previews/pexels-6303430-donkey-kick.jpg"},
    {id:83,name:"Shadow Boxing",title:"A Man Doing Shadow Boxing at the Gym",creator:"Pavel Danilyuk",source:"https://www.pexels.com/video/a-man-doing-shadow-boxing-at-the-gym-6296438/",license:"Pexels License",licenseUrl:"https://www.pexels.com/legal-pages/license/",attribution:"Not required; credit appreciated",hosting:"Permitted as website/app content",warning:"Exact movement; demonstrated intensity may exceed LockIn's beginner pace.",kind:"video",preview:"static/review_previews/pexels-6296438-shadow-boxing.mp4"},
    {id:84,name:"Basic Burpee",title:"A Man Doing Burpees",creator:"Pavel Danilyuk",source:"https://www.pexels.com/video/a-man-doing-burpees-8858142/",license:"Pexels License",licenseUrl:"https://www.pexels.com/legal-pages/license/",attribution:"Not required; credit appreciated",hosting:"Permitted as website/app content",warning:"Review whether the demonstrated jump agrees with LockIn's optional-jump wording.",kind:"video",preview:"static/review_previews/pexels-8858142-burpee.mp4"},
    {id:88,name:"Single-leg Balance",title:"Single Leg Balance",creator:"Klewis425",source:"https://commons.wikimedia.org/wiki/File:Single_Leg_Balance.jpg",license:"CC BY-SA 3.0",licenseUrl:"https://creativecommons.org/licenses/by-sa/3.0/",attribution:"Required; adaptations are ShareAlike",hosting:"Permitted with creator credit and license link",warning:"Static image; compare its free-leg position with LockIn's simple beginner hold.",kind:"image",preview:"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/Single_Leg_Balance.jpg/500px-Single_Leg_Balance.jpg"},
    {id:91,name:"Standing Tree Pose",title:"Woman Doing Tree Pose",creator:"Monstera Production",source:"https://www.pexels.com/video/woman-doing-tree-pose-6323275/",license:"Pexels License",licenseUrl:"https://www.pexels.com/legal-pages/license/",attribution:"Not required; credit appreciated",hosting:"Permitted as website/app content",warning:"Exact pose; compare foot placement with LockIn's ankle-or-calf beginner option.",kind:"video",preview:"static/review_previews/pexels-6323275-tree-pose.mp4"},
    {id:109,name:"Ankle Circles",title:"Ankle Circles 1 and 2",creator:"Everkinetic",source:"https://commons.wikimedia.org/wiki/File:Ankle_circles_1.svg",source2:"https://commons.wikimedia.org/wiki/File:Ankle_circles_2.svg",license:"CC BY-SA 3.0",licenseUrl:"https://creativecommons.org/licenses/by-sa/3.0/",attribution:"Required; adaptations are ShareAlike",hosting:"Permitted with creator credit and license link",warning:"Two static poses; review whether body position matches LockIn's seated version.",kind:"image",preview:"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/03/Ankle_circles_1.svg/500px-Ankle_circles_1.svg.png"}
  ];
  const key="lockin-missing-media-review-v1", decisions=JSON.parse(localStorage.getItem(key)||"{}");
  const esc=s=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function media(c){if(c.kind==="image")return `<div class="preview"><img src="${esc(c.preview)}" alt="${esc(c.title)}"></div>`;if(c.kind==="video")return `<div class="preview"><video controls preload="metadata" src="${esc(c.preview)}"></video></div>`;return `<div class="preview external"><p>Pexels blocks reliable third-party preview embedding.<br><a href="${esc(c.source)}" target="_blank" rel="noopener">Open the item-level preview on Pexels</a></p></div>`}
  function render(){document.getElementById("cards").innerHTML=candidates.map(c=>`<article class="card"><h2>#${c.id} ${esc(c.name)}</h2>${media(c)}<h3>${esc(c.title)}</h3><div class="meta"><p><b>Creator:</b> ${esc(c.creator)}<br><b>Source:</b> <a href="${esc(c.source)}" target="_blank" rel="noopener">item page</a>${c.source2?` · <a href="${esc(c.source2)}" target="_blank" rel="noopener">pose 2</a>`:""}</p><p><b>License:</b> <a href="${esc(c.licenseUrl)}" target="_blank" rel="noopener">${esc(c.license)}</a><br><b>Attribution:</b> ${esc(c.attribution)}<br><b>Hosting:</b> ${esc(c.hosting)}</p></div><p class="warning"><b>Review:</b> ${esc(c.warning)}</p><div class="decision"><label><input type="radio" name="d-${c.id}" value="approve" ${decisions[c.id]==="approve"?"checked":""}> Approve</label><label><input type="radio" name="d-${c.id}" value="reject" ${decisions[c.id]==="reject"?"checked":""}> Reject</label></div></article>`).join("");document.querySelectorAll('input[type=radio]').forEach(x=>x.onchange=e=>{decisions[e.target.name.slice(2)]=e.target.value;localStorage.setItem(key,JSON.stringify(decisions));counts()});counts()}
  function counts(){const v=candidates.map(c=>decisions[c.id]);a.textContent=v.filter(x=>x==="approve").length;r.textContent=v.filter(x=>x==="reject").length;u.textContent=v.filter(x=>!x).length}
  document.getElementById("export").onclick=()=>{const data=candidates.map(c=>({lockin_id:c.id,exercise:c.name,source:c.source,decision:decisions[c.id]||"unreviewed"}));const x=document.createElement("a");x.href=URL.createObjectURL(new Blob([JSON.stringify({decisions:data},null,2)],{type:"application/json"}));x.download="missing_media_review_decisions.json";x.click();URL.revokeObjectURL(x.href)};render();
  </script>
</body></html>
