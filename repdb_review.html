<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LockIn RepDB Match Review</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f5f7fb; color: #172033; }
    header, main, footer { max-width: 1180px; margin: auto; padding: 20px; }
    header { position: sticky; top: 0; z-index: 2; background: #f5f7fbee; backdrop-filter: blur(8px); border-bottom: 1px solid #d9deea; }
    h1 { margin: 0 0 8px; font-size: 1.65rem; }
    .summary { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    .summary span { background: white; border: 1px solid #d9deea; border-radius: 8px; padding: 7px 10px; }
    button { border: 0; border-radius: 8px; padding: 9px 13px; cursor: pointer; font-weight: 650; }
    #export { background: #2457d6; color: white; }
    #clear { background: #e6e9f0; color: #172033; }
    .card { background: white; border: 1px solid #d9deea; border-radius: 12px; margin: 18px 0; padding: 18px; box-shadow: 0 2px 7px #1720330c; }
    .names { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .label { color: #5d6678; font-size: .78rem; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; }
    h2, h3 { margin: 4px 0 10px; }
    .warning { background: #fff4d8; border-left: 5px solid #e6a700; padding: 10px 12px; margin: 12px 0; }
    .poses { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    figure { margin: 0; border: 1px solid #d9deea; border-radius: 10px; padding: 8px; text-align: center; background: #fafbfe; }
    figure img { display: block; width: 100%; max-height: 360px; object-fit: contain; }
    figcaption { margin-top: 5px; color: #5d6678; }
    .missing { min-height: 220px; display: grid; place-items: center; color: #6d7585; }
    .details { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; margin-top: 15px; }
    ol { margin: 5px 0; padding-left: 22px; }
    .decision { display: flex; gap: 20px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #d9deea; }
    .decision label { font-size: 1.05rem; font-weight: 700; cursor: pointer; }
    input[type="radio"] { width: 18px; height: 18px; vertical-align: -3px; }
    footer { color: #5d6678; text-align: center; }
    footer a { color: #2457d6; }
    @media (max-width: 700px) { .names, .poses, .details { grid-template-columns: 1fr; } header { position: static; } }
  </style>
</head>
<body>
  <header>
    <h1>LockIn — Possible RepDB Match Review</h1>
    <p>Review all 27 candidates manually. Nothing is approved by default.</p>
    <div class="summary">
      <span>Approved: <strong id="approved">0</strong></span>
      <span>Rejected: <strong id="rejected">0</strong></span>
      <span>Unreviewed: <strong id="unreviewed">27</strong></span>
      <button id="export" type="button">Export decisions as JSON</button>
      <button id="clear" type="button">Clear all decisions</button>
    </div>
  </header>
  <main id="reviews"></main>
  <footer>
    Exercise data and free-tier illustrations by
    <a href="https://repdb.co" rel="nofollow">RepDB (repdb.co)</a>.
    Used in-app under the
    <a href="https://github.com/RepDB/exercise-dataset/blob/main/LICENSE-DATA.md">RepDB Free Tier License</a>.
  </footer>
  <script>
    const mediaRoot = "static/exercises/repdb_review/";
    const matches = [
      {id:1, lockin:"Wall Push-up", repdb:"Wall Push Ups", rid:"wall-push-ups", pos:"standing", eq:[], warn:"Name uses a plural/spelling variation; confirm the wall-supported pose.", inst:["Stand facing a wall.","Place both hands against the wall.","Bend your elbows and move your chest toward the wall.","Push yourself back to the starting position."]},
      {id:3, lockin:"Knee Push-up", repdb:"Knee Push Ups", rid:"knee-push-ups", pos:"floor", eq:[], warn:"Name uses a plural/spelling variation; confirm knees remain supported.", inst:["Start on your hands and knees.","Keep your body aligned from your knees to your head.","Bend your elbows to lower your chest.","Push back up."]},
      {id:4, lockin:"Regular Push-up", repdb:"Push-Up", rid:"push-up", pos:"floor", eq:[], warn:"RepDB uses a generic name; confirm this is a standard high-plank push-up.", inst:["Start in a high plank position.","Keep your body in a straight line.","Bend your elbows and lower your chest.","Push back up while keeping your body aligned."]},
      {id:6, lockin:"Dumbbell Row", repdb:"Bent-Over Dumbbell Row", rid:"bent-over-db-row", pos:"standing", eq:["dumbbells"], warn:"RepDB explicitly specifies a bent-over variation; compare torso angle and bilateral arm use.", inst:["Hold a dumbbell in each hand.","Hinge forward slightly with a stable back.","Pull your elbows toward your body.","Lower the dumbbells slowly."]},
      {id:9, lockin:"Biceps Curl", repdb:"Dumbbell Bicep Curl", rid:"bicep-curl", pos:"standing", eq:["dumbbells"], warn:"RepDB explicitly specifies dumbbells and uses singular “bicep.”", inst:["Stand while holding dumbbells.","Keep your elbows close to your body.","Bend your elbows to lift the weights.","Lower the weights slowly."]},
      {id:10, lockin:"Triceps Kickback", repdb:"Dumbbell Tricep Kickback", rid:"tricep-kickback", pos:"standing", eq:["dumbbells"], warn:"RepDB explicitly specifies a dumbbell variation; confirm the same hinged position.", inst:["Hold a dumbbell in each hand.","Lean forward slightly with a stable back.","Keep your upper arms close to your body.","Straighten your elbows and return slowly."]},
      {id:15, lockin:"Calf Raise", repdb:"Bodyweight Calf Raise", rid:"bodyweight-calf-raise", pos:"standing", eq:[], warn:"RepDB explicitly labels the movement bodyweight; confirm bilateral standing form.", inst:["Stand with your feet hip-width apart.","Raise your heels off the floor.","Pause briefly at the top.","Lower your heels slowly."]},
      {id:16, lockin:"Clamshell", repdb:"Clamshells", rid:"clamshells", pos:"lying", eq:[], warn:"Plural name variation; confirm it is unbanded and side-lying.", inst:["Lie on your side with your knees bent.","Keep your feet together.","Lift your upper knee without rolling your hips.","Lower your knee slowly and repeat."]},
      {id:25, lockin:"Supported Single-leg Balance", repdb:"Supported Single-Leg Stand", rid:"supported-single-leg-stand", pos:"standing", eq:["chair"], warn:"Terminology differs, and RepDB lists no equipment. Confirm that its pictured support is equivalent to a chair.", main:true, inst:["Stand beside a stable chair.","Hold the chair for support.","Lift one foot slightly off the floor.","Return your foot and switch sides."]},
      {id:34, lockin:"Dumbbell Chest Fly", repdb:"Dumbbell Fly", rid:"db-fly", pos:"lying", eq:["dumbbells","bench"], warn:"RepDB omits “chest”; verify the pose uses a bench and is not another fly variation.", inst:["Lie on a bench holding dumbbells above your chest.","Keep a slight bend in your elbows.","Open your arms out to the sides comfortably.","Bring the dumbbells back together above your chest."]},
      {id:35, lockin:"Standing Dumbbell Shoulder Press", repdb:"Dumbbell Shoulder Press", rid:"dumbbell-shoulder-press", pos:"standing", eq:["dumbbells"], warn:"Body position may differ: LockIn requires standing, while the RepDB name does not specify position.", inst:["Stand tall with feet shoulder-width apart holding dumbbells.","Bring the weights to shoulder height.","Press the dumbbells overhead without arching your back.","Lower them slowly to shoulder level."]},
      {id:37, lockin:"Pike Push-up", repdb:"Pike Push Ups", rid:"pike-push-ups", pos:"floor", eq:[], warn:"Plural name variation; confirm the downward-facing V body position.", inst:["Start in a downward-facing V shape with hips lifted.","Keep your hands shoulder-width apart on the floor.","Bend your elbows to lower the top of your head toward the floor.","Push back up to the starting position."]},
      {id:42, lockin:"Superman Hold", repdb:"Superman", rid:"superman", pos:"floor", eq:[], warn:"Movement type may differ: LockIn is an isometric hold, while RepDB supplies start and peak poses for a repetition.", inst:["Lie face down on the floor with arms extended overhead.","Gently lift your chest, arms, and legs off the floor.","Keep your neck neutral and gaze downward.","Hold the position comfortably while breathing steadily."]},
      {id:46, lockin:"Resistance Band Pull-apart", repdb:"Band Pull Apart", rid:"band-pull-apart", pos:"standing", eq:["resistance_band"], warn:"Shortened equipment name; verify standing position and chest-height band path.", inst:["Stand tall holding a resistance band straight in front of your chest.","Keep your arms extended at shoulder height.","Pull the band apart until it touches your chest.","Return slowly to the starting position."]},
      {id:49, lockin:"Hammer Curl", repdb:"Dumbbell Hammer Curl", rid:"hammer-curl", pos:"standing", eq:["dumbbells"], warn:"RepDB explicitly specifies dumbbells; confirm standing neutral-grip form.", inst:["Stand upright holding dumbbells with palms facing your sides.","Keep your elbows tucked close to your torso.","Curl the weights upward while keeping your palms facing inward.","Lower the dumbbells slowly."]},
      {id:51, lockin:"Overhead Triceps Extension", repdb:"Overhead Tricep Extension", rid:"overhead-tricep-extension", pos:"seated", eq:["dumbbells"], warn:"Body position may differ: LockIn is seated and uses one dumbbell held with both hands.", inst:["Sit upright holding one dumbbell with both hands overhead.","Keep your elbows pointed forward and close to your head.","Bend your elbows to lower the dumbbell behind your head.","Straighten your arms to press the weight back up."]},
      {id:53, lockin:"Close-grip Push-up", repdb:"Close Grip Push Ups", rid:"close-grip-push-ups", pos:"floor", eq:[], warn:"Plural/hyphen variation; compare exact hand width and elbow path.", inst:["Start in a high plank with hands placed directly under your shoulders.","Keep your elbows tucked close to your ribs as you lower.","Lower your chest toward the floor.","Push back up to the starting position."]},
      {id:59, lockin:"Step-up", repdb:"Step Ups", rid:"step-ups", pos:"standing", eq:["step"], warn:"RepDB metadata lists no equipment although LockIn requires a sturdy step; verify the pictured platform.", inst:["Stand facing a sturdy low step or platform.","Place one foot completely on the step.","Press through that foot to lift your body up.","Step down slowly and repeat on the other leg."]},
      {id:65, lockin:"Supported Reverse Lunge", repdb:"Reverse Lunge", rid:"reverse-lunge", pos:"standing", eq:["chair"], warn:"Important equipment/variation difference: LockIn uses chair support; RepDB does not identify the supported variation.", inst:["Stand beside a sturdy chair and rest one hand on it for balance.","Step one foot backward and bend both knees gently.","Return to the starting position.","Repeat and switch sides."]},
      {id:67, lockin:"Knee Side Plank", repdb:"Side Plank", rid:"side-plank", pos:"floor", eq:[], warn:"Important variation difference: LockIn supports the body on bent knees; RepDB may show the full side plank.", main:true, inst:["Lie on your side with your knees bent and forearm on the floor.","Lift your hips so your body forms a straight line from knees to head.","Engage your side abdominal muscles.","Hold comfortably and repeat on the other side."]},
      {id:69, lockin:"Basic Crunch", repdb:"Crunches", rid:"crunches", pos:"floor", eq:[], warn:"Generic RepDB name; confirm it shows a basic floor crunch rather than another variation.", inst:["Lie on your back with your knees bent and feet flat on the floor.","Place your hands across your chest or lightly behind your ears.","Curl your shoulders slightly off the floor using your abdominal muscles.","Lower back down slowly."]},
      {id:70, lockin:"Reverse Crunch", repdb:"Reverse Crunches", rid:"reverse-crunches", pos:"floor", eq:[], warn:"Plural name variation; compare hip lift and knee position.", inst:["Lie on your back with knees bent and feet off the floor.","Place your arms at your sides for support.","Draw your knees toward your chest while lifting your hips slightly.","Lower your hips back down with control."]},
      {id:74, lockin:"Leg Raise", repdb:"Lying Leg Raise", rid:"lying-leg-raise", pos:"floor", eq:[], warn:"RepDB explicitly specifies lying; confirm straight legs and the same range of motion.", inst:["Lie flat on your back with legs straight and hands at your sides.","Keep your lower back pressed toward the floor.","Lift both legs upward until vertical.","Lower them slowly without letting your lower back arch."]},
      {id:77, lockin:"Pallof Press", repdb:"Banded Pallof Press", rid:"banded-pallof-press", pos:"standing", eq:["resistance_band"], warn:"RepDB explicitly specifies the banded variation; verify standing position and anchor height.", inst:["Anchor a resistance band at chest height and stand sideways to it.","Hold the band with both hands against the center of your chest.","Press your hands straight forward without letting your torso twist.","Return your hands to your chest and switch sides after your set."]},
      {id:78, lockin:"Jumping Jack", repdb:"Jumping Jacks", rid:"jumping-jacks", pos:"standing", eq:[], warn:"Plural name variation; verify full-impact jumping form rather than a step-out variation.", inst:["Stand upright with your feet together and arms at your sides.","Jump your feet out wide while swinging your arms overhead.","Jump your feet back together while lowering your arms.","Maintain a steady, comfortable rhythm."]},
      {id:81, lockin:"Mountain Climber", repdb:"Mountain Climbers", rid:"mountain-climbers", pos:"floor", eq:[], warn:"Plural name variation; confirm high-plank knee-drive form.", inst:["Start in a high plank position with hands under your shoulders.","Drive one knee toward your chest.","Switch legs quickly while keeping your hips level.","Continue at a controlled, brisk pace."]},
      {id:93, lockin:"Single-leg Calf Raise Hold", repdb:"Single Leg Calf Raise", rid:"single-leg-calf-raise", pos:"standing", eq:[], warn:"Important movement difference: LockIn holds the peak position; RepDB depicts a dynamic single-leg raise. The earlier alternative “Calf Raise Hold” is a hold but is not single-leg.", inst:["Stand on one foot near a wall for light support if needed.","Press onto the ball of your standing foot to lift your heel.","Hold the raised position steadily.","Lower your heel slowly and switch legs."]}
    ];

    const storageKey = "lockin-repdb-review-v1";
    const decisions = JSON.parse(localStorage.getItem(storageKey) || "{}");
    const esc = value => String(value).replace(/[&<>\"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

    function pose(match, kind) {
      const actual = match.main ? "main" : kind;
      if (match.main && kind === "peak") return `<figure><div class="missing">RepDB provides one main pose only</div><figcaption>No peak pose available</figcaption></figure>`;
      const path = `${mediaRoot}${match.rid}-${actual}.webp`;
      return `<figure><img src="${esc(path)}" alt="${esc(match.repdb)} ${actual} pose"><figcaption>${actual[0].toUpperCase() + actual.slice(1)} pose</figcaption></figure>`;
    }

    function render() {
      document.getElementById("reviews").innerHTML = matches.map(match => `
        <article class="card" id="match-${match.id}">
          <div class="names">
            <div><div class="label">LockIn #${match.id}</div><h2>${esc(match.lockin)}</h2></div>
            <div><div class="label">Proposed RepDB exercise</div><h2>${esc(match.repdb)}</h2><code>${esc(match.rid)}</code></div>
          </div>
          <div class="warning"><strong>Review carefully:</strong> ${esc(match.warn)}</div>
          <div class="poses">${pose(match,"start")}${pose(match,"peak")}</div>
          <div class="details">
            <div><div class="label">LockIn comparison data</div><p><strong>Position:</strong> ${esc(match.pos)}<br><strong>Equipment:</strong> ${esc(match.eq.join(", ") || "none")}</p></div>
            <div><div class="label">LockIn instructions</div><ol>${match.inst.map(step => `<li>${esc(step)}</li>`).join("")}</ol></div>
          </div>
          <div class="decision" role="group" aria-label="Decision for ${esc(match.lockin)}">
            <label><input type="radio" name="decision-${match.id}" value="approve" ${decisions[match.id] === "approve" ? "checked" : ""}> Approve</label>
            <label><input type="radio" name="decision-${match.id}" value="reject" ${decisions[match.id] === "reject" ? "checked" : ""}> Reject</label>
          </div>
        </article>`).join("");
      document.querySelectorAll('input[type="radio"]').forEach(input => input.addEventListener("change", event => {
        decisions[event.target.name.replace("decision-", "")] = event.target.value;
        localStorage.setItem(storageKey, JSON.stringify(decisions));
        updateCounts();
      }));
      updateCounts();
    }

    function updateCounts() {
      const values = matches.map(match => decisions[match.id]);
      document.getElementById("approved").textContent = values.filter(value => value === "approve").length;
      document.getElementById("rejected").textContent = values.filter(value => value === "reject").length;
      document.getElementById("unreviewed").textContent = values.filter(value => !value).length;
    }

    document.getElementById("export").addEventListener("click", () => {
      const report = {
        generated_at: new Date().toISOString(),
        source: "RepDB free tier",
        decisions: matches.map(match => ({
          lockin_id: match.id, lockin_name: match.lockin,
          repdb_id: match.rid, repdb_name: match.repdb,
          decision: decisions[match.id] || "unreviewed"
        }))
      };
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], {type:"application/json"}));
      link.download = "repdb_review_decisions.json";
      link.click();
      URL.revokeObjectURL(link.href);
    });
    document.getElementById("clear").addEventListener("click", () => {
      if (!confirm("Clear all 27 saved review decisions?")) return;
      Object.keys(decisions).forEach(key => delete decisions[key]);
      localStorage.removeItem(storageKey);
      render();
    });
    render();
  </script>
</body>
</html>
